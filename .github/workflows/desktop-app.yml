name: Desktop App

# Build the Tauri desktop shell on macOS + Windows and publish installers
# to a rolling "desktop-latest" release. Push triggers are limited to master;
# any other branch can still be built manually via workflow_dispatch.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'desktop/**'
      - 'web/**'
      - 'config/**'
      - 'core/**'
      - 'cmd/**'
      - 'agent/**'
      - 'platform/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop-app.yml'

concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # ── macOS: Makefile builds the sidecar (embedded web UI) and bundles
      # CC Connect.app + dmg via `pnpm tauri build`.
      - name: Build and bundle (macOS)
        if: runner.os == 'macOS'
        run: make app

      - name: Package .app (macOS)
        if: runner.os == 'macOS'
        run: |
          cd desktop/src-tauri/target/release/bundle/macos
          zip -ry "CC-Connect-macOS.zip" "CC Connect.app"

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: CC-Connect-macOS
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/CC-Connect-macOS.zip
          if-no-files-found: error

      # ── Windows: build the sidecar explicitly (Makefile targets are
      # Unix-shell only), then bundle the NSIS installer.
      - name: Build web UI (Windows)
        if: runner.os == 'Windows'
        working-directory: web
        shell: bash
        run: pnpm build

      - name: Build engine sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=$(sed -n 's/^VERSION *:= *//p' Makefile)
          go build -tags 'goolm' -ldflags "-s -w -X main.version=${VERSION}" \
            -o desktop/src-tauri/binaries/cc-connect-x86_64-pc-windows-msvc.exe ./cmd/cc-connect

      - name: Bundle installer (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: bash
        run: |
          pnpm install --silent
          pnpm tauri build --bundles nsis

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CC-Connect-Windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Collect every platform's installers into one rolling release so users
  # always have a single "latest" download point.
  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job: point gh at the repo explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # upload-artifact nests files under bundle/{dmg,macos}; flatten.
          find dist -mindepth 2 -type f -exec mv -f {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
          ls -la dist/
          # Recreate the release so stale assets from older versions never linger.
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest \
            --title "Desktop App (latest)" \
            --notes "Automated build from master @ $GITHUB_SHA" \
            --latest
          # Upload one by one: installer filenames contain spaces.
          for f in dist/*; do
            gh release upload desktop-latest "$f"
          done
