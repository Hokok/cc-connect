[package]
name = "cc-connect-desktop"
version = "1.5.1"
description = "CC Connect desktop shell"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
libc = "0.2"

[profile.release]
strip = true
lto = true
